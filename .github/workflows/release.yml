name: Release Snovac Compiler

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0, v1.0.1, latest)'
        required: true
        default: 'latest'
        type: string
      release_name:
        description: 'Release Title'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create as Draft Release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
          - os: darwin
            arch: aarch64
            runner: macos-latest
          - os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            grep
            gawk
            diffutils
            python
            mingw-w64-ucrt-x86_64-gcc

      - name: Compile snovac binary
        if: matrix.os != 'windows'
        run: |
          make clean
          make

      - name: Compile snovac binary (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          # `make` writes compile_commands.json with `python`. MSYS2's
          # python package provides python3.
          if ! command -v python >/dev/null 2>&1; then
            if ! command -v python3 >/dev/null 2>&1; then
              echo "python3 is required to build compile_commands.json" >&2
              exit 1
            fi
            mkdir -p /usr/local/bin
            printf '%s\n' '#!/bin/sh' 'exec python3 "$@"' > /usr/local/bin/python
            chmod +x /usr/local/bin/python
          fi
          make clean OS=Windows_NT
          make OS=Windows_NT EXTRA_LIBS="-lws2_32 -static"

      - name: Run Test Gates
        if: matrix.os != 'windows'
        run: make test

      - name: Run Test Gates (Windows)
        if: matrix.os == 'windows'
        timeout-minutes: 30
        shell: msys2 {0}
        run: make test OS=Windows_NT EXTRA_LIBS="-lws2_32 -static"

      - name: Package release artifact
        if: matrix.os != 'windows'
        run: |
          mkdir -p dist
          cp build/snl dist/snl
          tar -czf "snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist snl
          shasum -a 256 "snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" > "snovac-${{ matrix.os }}-${{ matrix.arch }}.sha256"

      - name: Package Windows release archive
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/snl.exe dist/snl.exe
          Compress-Archive -Path dist/snl.exe -DestinationPath snovac-windows-x86_64.zip
          $hash = (Get-FileHash -Algorithm SHA256 snovac-windows-x86_64.zip).Hash.ToLowerInvariant()
          "{0}  snovac-windows-x86_64.zip" -f $hash | Set-Content -Encoding ascii snovac-windows-x86_64.sha256

      - name: Upload Build Artifacts
        if: matrix.os != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: snovac-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            snovac-${{ matrix.os }}-${{ matrix.arch }}.sha256
          retention-days: 30

      - name: Upload Windows archive
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: snovac-windows-x86_64
          path: |
            snovac-windows-x86_64.zip
            snovac-windows-x86_64.sha256
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release files
        run: |
          mkdir -p release-dist
          find release-assets -type f -exec cp {} release-dist/ \;
          ls -la release-dist

      - name: Determine Tag and Title
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            TITLE="${{ inputs.release_name }}"
            [ -z "$TITLE" ] && TITLE="Snovalang Compiler ${TAG}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="Snovalang Compiler ${TAG}"
          else
            TAG="latest"
            TITLE="Snovalang Compiler (Latest Release)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          # Notes for v0.0.1-p3. Replace this body when cutting the next tag.
          body: |
            snl 0.0.1-p3

            This release accepts break, continue, null, a function or method with no body, class, enum, trait, match, async, await, pulsar, for, and defer.

            bootstrap/src/compiler.snl is the self-hosted compiler for this slice.
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
