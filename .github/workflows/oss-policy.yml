name: Open source policy

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  apache-2.0:
    name: Apache License 2.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require the Apache License, Version 2.0
        run: |
          set -eu
          test -f LICENSE
          test -f NOTICE
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0, January 2004" LICENSE
          grep -q "http://www.apache.org/licenses/" LICENSE
          grep -q "Snovalang contributors" NOTICE
