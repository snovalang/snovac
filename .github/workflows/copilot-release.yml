name: Release with Copilot semver

# Manual only. Copilot reads the commits since the last v* tag and prints the
# next MAJOR.MINOR.PATCH. Gemini then reviews the diff and writes the English
# release notes (features, bug fixes, breaking changes). This workflow tags
# that commit and dispatches Release Snovac
# Compiler, which attaches the binaries. Organization repos need the policy
# "Allow use of Copilot CLI billed to the organization". A tag push made with
# GITHUB_TOKEN does not start other workflows, so this file dispatches the
# release workflow itself. Gemini reads the GEMINI_API_KEY Actions secret.

on:
  workflow_dispatch:
    inputs:
      summary:
        description: "Optional hint for Copilot about what this release should emphasize"
        required: false
        type: string

permissions:
  contents: write
  actions: write
  copilot-requests: write

jobs:
  release:
    name: Verify, choose SemVer, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tree Copilot is about to release
        run: make test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Collect history for Copilot
        id: history
        run: |
          set -euo pipefail
          CURRENT="$(sed -n 's/^#define SNOVAC_VERSION \"\(.*\)\"/\1/p' src/driver/driver_utils.h | head -n 1)"
          LAST="$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)"
          if [ -n "$LAST" ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse "${LAST}^{commit}")" ]; then
            echo "HEAD is already released as ${LAST}. Push a new commit before running this again."
            exit 1
          fi
          {
            echo "Current SNOVAC_VERSION: $CURRENT"
            echo "Previous release tag: ${LAST:-none}"
            echo
            echo "Commits:"
            if [ -n "$LAST" ]; then
              git log --pretty=format:'%h %s' "${LAST}..HEAD"
              echo
              echo
              echo "Diff stat:"
              git diff --stat "${LAST}..HEAD"
            else
              git log --pretty=format:'%h %s' -n 80
              echo
              echo
              echo "Diff stat:"
              git log --stat -n 40
            fi
          } > /tmp/snovac-release-context.txt

      - name: Ask Copilot for the next SemVer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: "false"
          RELEASE_HINT: ${{ inputs.summary }}
        run: |
          copilot -s --no-ask-user -p "$(cat <<EOF
          You are the release engineer for the snovac compiler.
          Choose the next SemVer for this manual release. Reply with one line
          and nothing else:

          VERSION: MAJOR.MINOR.PATCH

          Rules, applied to the core of the current version (ignore a -pN suffix):
          - While the major number is 0, a breaking parser, AST, bytecode, or CLI change bumps MINOR and sets PATCH to 0.
          - While the major number is 0, a backward-compatible feature bumps PATCH.
          - When the major number is 1 or more: breaking changes bump MAJOR, features bump MINOR, fixes bump PATCH.
          - The new triple must be strictly greater than the current core.
          - Use only digits and two dots. No v prefix, no pre-release suffix.
          - Base the choice on the commits and diff stat below, not on the hint alone.
          - Do not write release notes. Gemini writes those after this step.

          Maintainer hint: ${RELEASE_HINT:-none}

          $(cat /tmp/snovac-release-context.txt)
          EOF
          )" > copilot-semver.out
          cat copilot-semver.out >> "$GITHUB_STEP_SUMMARY"

      - name: Write SNOVAC_VERSION
        id: semver
        run: |
          VER="$(python3 scripts/copilot_release_semver.py copilot-semver.out)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Copilot chose $VER" >> "$GITHUB_STEP_SUMMARY"

      - name: Ask Gemini for the code review and English release notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/gemini_release_notes.py --version "v${{ steps.semver.outputs.version }}"
          echo "### Gemini" >> "$GITHUB_STEP_SUMMARY"
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the version and tag it
        run: |
          VER="${{ steps.semver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/driver/driver_utils.h RELEASE_NOTES.md "docs/releases/v${VER}"
          git commit -m "chore(release): snovac ${VER}"
          git tag -a "v${VER}" -m "snovac ${VER}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VER}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.semver.outputs.version }}"
          gh workflow run release.yml --ref "v${VER}" -f "tag_name=v${VER}"
