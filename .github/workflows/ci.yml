name: CI & Automated Binary Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Standalone Linux job. It is not a matrix leg, so a missing macOS runner
  # cannot leave Unix queued. ubuntu-24.04 is pinned because Mull is built
  # against LLVM 18, which matches that image.
  unix:
    name: Unix (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile and run unit tests
        run: |
          make clean
          make test

      - name: Install Mull
        run: |
          sudo apt-get install -y clang-18 curl ca-certificates
          curl -1sLf 'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' | sudo bash
          sudo apt-get install -y mull-18
          mull-runner-18 --version

      - name: Run Mull mutation tests
        run: sh .github/scripts/mull-unix.sh

  install-ps1:
    name: Windows installer dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell
        run: |
          curl -fsSL -o /tmp/pwsh.tar.gz https://github.com/PowerShell/PowerShell/releases/download/v7.5.4/powershell-7.5.4-linux-x64.tar.gz
          sudo mkdir -p /opt/microsoft/powershell/7
          sudo tar -xzf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
          sudo chmod +x /opt/microsoft/powershell/7/pwsh
          sudo ln -sfn /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh

      - name: Simulate irm | iex with no script path
        run: pwsh -NoProfile -File tests/install_iex_dry_run.ps1

  test-macos:
    name: Test & Conformance (darwin-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 has no hosted runner, so the old darwin-x86_64 leg stayed
          # queued and blocked every job that needed the whole test matrix.
          - arch: aarch64
            runner: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Run Full Test Suite
        run: |
          make clean
          make test

  build-unix:
    name: Build Binary Artifact (linux-x86_64)
    needs: unix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile snovac binary
        run: |
          make clean
          make

      - name: Package binary artifact
        run: |
          mkdir -p dist
          cp build/snl dist/snl
          tar -czf snovac-linux-x86_64.tar.gz -C dist snl
          shasum -a 256 snovac-linux-x86_64.tar.gz > snovac-linux-x86_64.sha256

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snovac-linux-x86_64
          path: |
            snovac-linux-x86_64.tar.gz
            snovac-linux-x86_64.sha256
          retention-days: 30

  build-macos:
    name: Build Binary Artifact (darwin-${{ matrix.arch }})
    needs: test-macos
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile snovac binary
        run: |
          make clean
          make

      - name: Package binary artifact
        run: |
          mkdir -p dist
          cp build/snl dist/snl
          tar -czf "snovac-darwin-${{ matrix.arch }}.tar.gz" -C dist snl
          shasum -a 256 "snovac-darwin-${{ matrix.arch }}.tar.gz" > "snovac-darwin-${{ matrix.arch }}.sha256"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snovac-darwin-${{ matrix.arch }}
          path: |
            snovac-darwin-${{ matrix.arch }}.tar.gz
            snovac-darwin-${{ matrix.arch }}.sha256
          retention-days: 30
