name: Cursor Review

# Manual review. Dispatch it with the pull request number.
#
# The job posts the documented Cursor GitHub trigger (`cursor review`), which
# asks Bugbot to review that pull request, then waits for the check named
# `Cursor Bugbot` on the pull request head. Approval is a separate check run
# named `Cursor Review` on that same SHA:
#   success — Bugbot concluded success (no findings, no unresolved comments)
#   failure — any other conclusion, or Bugbot did not finish
# The comment only starts the review. It is not the merge gate.
#
# The GitHub token used by automation cannot edit branch protection or
# rulesets (both APIs return 403). Merge stays open until a repository admin
# requires the status check below. The gate is not active until they do.
#
# Settings → Rules → Rulesets → New branch ruleset (or Branch protection rule)
#   Target: master (refs/heads/master)
#   Rule: Require status checks to pass
#   Required check: Cursor Review
# Do not require `Cursor Bugbot` instead. Findings conclude `neutral` by
# default, and GitHub treats neutral as passing.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  cursor-review:
    name: Cursor Review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Run Cursor review and publish the merge check
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`pull_request must be a positive integer, got "${process.env.PR_NUMBER}"`);
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const headSha = pr.head.sha;
            core.info(`Reviewing PR #${prNumber} at ${headSha}`);

            const requestedAt = Date.now();
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: "cursor review",
            });

            const deadline = Date.now() + 20 * 60 * 1000;
            let bugbot = null;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                check_name: "Cursor Bugbot",
                per_page: 100,
              });
              const runs = data.check_runs.filter((run) => {
                const started = Date.parse(run.started_at || "");
                return Number.isFinite(started) && started >= requestedAt - 5000;
              });
              runs.sort((a, b) => Date.parse(b.started_at) - Date.parse(a.started_at));
              const latest = runs[0];
              if (latest && latest.status === "completed") {
                bugbot = latest;
                break;
              }
              core.info(
                latest
                  ? `Cursor Bugbot is ${latest.status}; waiting`
                  : "Cursor Bugbot has not started; waiting"
              );
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            const approved = bugbot && bugbot.conclusion === "success";
            const summary = approved
              ? "Cursor Bugbot concluded success. This check approves the pull request head."
              : bugbot
                ? `Cursor Bugbot concluded ${bugbot.conclusion}. Success is the only approving conclusion.`
                : "Cursor Bugbot did not finish. Install the Cursor GitHub app, enable Bugbot on this repository, and dispatch again. Draft pull requests also need Bugbot's draft-review setting.";

            await github.rest.checks.create({
              owner,
              repo,
              name: "Cursor Review",
              head_sha: headSha,
              status: "completed",
              conclusion: approved ? "success" : "failure",
              output: {
                title: approved ? "Cursor review approved" : "Cursor review not approved",
                summary,
              },
            });

            if (!approved) {
              core.setFailed(summary);
            }
