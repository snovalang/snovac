name: "Gemini PR Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request number to review"
        required: true
        type: number
      additional_context:
        description: "Optional review instructions (e.g. 'focus on memory safety')"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  review:
    name: "Gemini Code Review"
    if: |-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@gemini-cli /review'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Extract PR Number & Context
        id: pr_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            CTX=""
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ inputs.pull_request_number }}"
            CTX="${{ inputs.additional_context }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUM="${{ github.event.issue.number }}"
            RAW_BODY="${{ github.event.comment.body }}"
            CTX=$(echo "$RAW_BODY" | sed -E 's/.*@gemini-cli \/review//' | xargs)
          fi
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "context=$CTX" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare prompt context
        shell: bash
        run: |
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ steps.pr_info.outputs.number }}
          ADDITIONAL_CONTEXT: ${{ steps.pr_info.outputs.context }}

      - name: Run Gemini PR Review
        uses: google-github-actions/run-gemini-cli@v0
        id: gemini_pr_review
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ steps.pr_info.outputs.number }}
          ADDITIONAL_CONTEXT: ${{ steps.pr_info.outputs.context }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gcp_project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          gemini_model: "gemini-3.1-pro-preview"
          workflow_name: "gemini-review"
          github_pr_number: ${{ steps.pr_info.outputs.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "create_pending_pull_request_review",
                    "add_comment_to_pending_review",
                    "submit_pending_pull_request_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: "/pr-code-review"
